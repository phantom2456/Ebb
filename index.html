<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ebb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Ebb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm night companion. Honest numbers, never a lecture.
   IDEA: a little aquarium. Your week is the water and Lotl the axolotl lives in it.
   PICTURE: the tank, clear and glowing under plan, clouding coral past it.
   COLOUR+TYPE: ink-violet night, aqua for clear water, coral past plan; Instrument Serif numerals, Inter Tight UI.
   LAYOUT: one phone column. Tank first, quick add, today's log, tab bar. */
:root{color-scheme:dark;--bg:#0b0a10;--s1:#14121b;--s2:#1c1925;--s3:#272334;--line:#2d2939;--ink:#f3eff7;--mute:#a49db3;--dim:#6f6881;--aqua:#7be0d3;--aqua2:#2f9e95;--pink:#f7a9d4;--gill:#ff7ab8;--warm:#ffb08a;--over:#ff5d63;--lav:#c9a8ff;--r:22px;--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(120% 60% at 50% -10%,#1b1430 0,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font:16px/1.5 "Inter Tight",system-ui,-apple-system,sans-serif;overflow-x:clip;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--aqua);outline-offset:2px;border-radius:12px}
.num{font-family:"Instrument Serif",Georgia,serif;font-weight:400;letter-spacing:-.01em;font-variant-numeric:lining-nums}
.app{max-width:540px;margin:0 auto;padding:calc(var(--safeT) + 14px) 16px calc(var(--safeB) + 104px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;letter-spacing:-.02em}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--aqua);box-shadow:0 0 14px var(--aqua)}
.date{color:var(--mute);font-size:14px}
.sync{font-size:13px;color:var(--dim)}
h1{font-size:34px;line-height:1.05;margin:4px 0 14px;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:19px;margin:26px 0 10px;font-weight:600;letter-spacing:-.01em}
h3{font-size:22px;line-height:1.15;margin:4px 0 8px;font-weight:600;text-wrap:balance}
p{margin:0 0 10px}
.mute{color:var(--mute)}.dim{color:var(--dim)}.overc{color:var(--over)}.aq{color:var(--aqua)}.warm{color:var(--warm)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
/* hero tank */
.tank{position:relative;margin:0 -6px;height:clamp(430px,calc(100svh - 262px - var(--safeB)),720px);border-radius:32px;overflow:hidden;border:1px solid rgba(255,255,255,.08);isolation:isolate;background:radial-gradient(130% 55% at 50% -8%,rgba(255,255,255,.18),transparent 60%),linear-gradient(180deg,var(--w1),var(--w2)),#06121a;box-shadow:0 30px 60px -34px rgba(0,0,0,.9),inset 0 0 90px rgba(0,0,0,.5);-webkit-tap-highlight-color:transparent;contain:layout paint}
.rays{position:absolute;inset:-12% -25% 35%;z-index:0;pointer-events:none;background:repeating-linear-gradient(100deg,transparent 0 46px,rgba(255,255,255,.06) 46px 80px,transparent 80px 140px);-webkit-mask-image:linear-gradient(180deg,#000,transparent);mask-image:linear-gradient(180deg,#000,transparent);transform-origin:50% 0;animation:rays 16s ease-in-out infinite alternate}
@keyframes rays{from{transform:skewX(-7deg) translateX(-24px);opacity:.65}to{transform:skewX(7deg) translateX(24px);opacity:1}}
.mote{position:absolute;z-index:1;width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none;animation:drift var(--d) linear infinite;animation-delay:var(--dl);opacity:0}
@keyframes drift{0%{transform:translate(0,0);opacity:0}15%{opacity:.8}100%{transform:translate(var(--dx),-140px);opacity:0}}
.sand{position:absolute;left:0;right:0;bottom:0;height:13%;z-index:1;pointer-events:none}
.rock{position:absolute;left:3%;bottom:6%;width:31%;max-width:140px;z-index:1;pointer-events:none}
.weeds{position:absolute;right:4%;bottom:5%;width:19%;max-width:86px;z-index:1;pointer-events:none;overflow:visible}
.weed{transform-box:fill-box;transform-origin:50% 100%;animation:weed 5.5s ease-in-out infinite alternate}.weed.w2{animation-duration:4.6s;animation-delay:-2s}.weed.w3{animation-duration:6.4s;animation-delay:-1s}
@keyframes weed{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.bub{position:absolute;bottom:4%;width:9px;height:9px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);z-index:2;animation:rise 7s ease-in infinite;opacity:0;pointer-events:none}
@keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.85}100%{transform:translate(10px,-420px);opacity:0}}
.tank.m-wilt .bub,.tank.m-wary .bub:nth-child(odd){display:none}
.haze{position:absolute;left:0;right:0;bottom:0;z-index:4;height:var(--hz);background:linear-gradient(180deg,var(--hzc),var(--hzc2));transition:height 1.4s cubic-bezier(.22,1,.36,1),background 1.2s;pointer-events:none}
.haze svg{position:absolute;left:0;top:-13px;width:200%;height:14px;animation:wave 8s linear infinite}
.haze svg path{fill:var(--hzc);transition:fill 1.2s}
@keyframes wave{to{transform:translateX(-50%)}}
.limit{position:absolute;left:14px;right:14px;bottom:62%;z-index:4;border-top:1.5px dashed rgba(255,255,255,.32);pointer-events:none}
.limit span{position:absolute;right:0;top:-19px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:600}
.stage{position:absolute;left:0;right:0;top:27%;bottom:13%;z-index:3;display:grid;place-items:center;pointer-events:none}
.swim{position:relative;width:min(76%,330px);display:grid;place-items:center;animation:swim 19s ease-in-out infinite}
@keyframes swim{0%,100%{transform:translate(0,0) rotate(0)}18%{transform:translate(-13%,-7%) rotate(-4deg)}40%{transform:translate(9%,-11%) rotate(3deg)}62%{transform:translate(14%,3%) rotate(5deg)}82%{transform:translate(-7%,6%) rotate(-2deg)}}
.tank.m-wary .swim{animation-duration:26s}.tank.m-wilt .swim{animation-duration:38s}
.aura{position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(closest-side,rgba(247,169,212,.42),rgba(123,224,211,.12) 62%,transparent);opacity:var(--au);transition:opacity 1.2s;z-index:-1}
.act{position:relative;width:100%;pointer-events:auto;cursor:pointer;transform-origin:50% 62%;-webkit-tap-highlight-color:transparent}
.act .lotl{max-width:none;display:block}
.hud{position:absolute;left:0;right:0;top:0;z-index:5;padding:18px 18px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;pointer-events:none;text-shadow:0 1px 14px rgba(0,0,0,.5)}
.hud button{pointer-events:auto}
.hud .big{font-size:clamp(58px,17vw,82px)}
.hud .meter{max-width:230px}
.tday{display:grid;justify-items:end;gap:8px}
.chipg{padding:8px 12px;border-radius:16px;background:rgba(9,8,14,.42);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.09);text-align:right;line-height:1.15;text-shadow:none}
.chipg b{font-family:"Instrument Serif",serif;font-weight:400;font-size:30px}
.tday .pill{min-height:38px;padding:0 12px;font-size:14px;background:rgba(9,8,14,.42);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-color:rgba(255,255,255,.1);text-shadow:none}
.moodline{position:absolute;left:14px;right:14px;bottom:14px;z-index:5;font-size:15px;font-weight:500;padding:11px 14px;border-radius:16px;background:rgba(9,8,14,.5);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);pointer-events:none;transition:opacity .4s}
.glass{position:absolute;inset:0;z-index:7;pointer-events:none;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,.08),transparent 26%,transparent 72%,rgba(255,255,255,.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.tank.paused *,.tank.paused{animation-play-state:paused!important}
.lbl{font-size:14px;color:var(--mute);font-weight:500}
.big{font-size:clamp(64px,19vw,88px);line-height:.9}
.big small{font-size:.38em;color:var(--mute);font-family:"Inter Tight",sans-serif;font-weight:500;margin-left:4px;letter-spacing:0}
.meter{position:relative;height:10px;border-radius:6px;background:rgba(255,255,255,.1);margin:12px 0 8px;overflow:visible}
.meter b{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--aqua);transition:width .9s cubic-bezier(.22,1,.36,1)}
.meter b.over{background:linear-gradient(90deg,var(--aqua) var(--lim),var(--over) var(--lim))}
.meter i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.7;border-radius:2px}
.tline{font-size:14px;color:rgba(243,239,247,.78)}
/* Lotl */
.lotl{width:100%;max-width:190px;overflow:visible;animation:bob 3.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.lotl .gill{transform-box:view-box;animation:gill 2.8s ease-in-out infinite}
@keyframes gill{50%{transform:rotate(-9deg)}}
.lotl .tail{transform-box:view-box;transform-origin:150px 152px;animation:tail 2.4s ease-in-out infinite}
@keyframes tail{50%{transform:rotate(10deg)}}
.lotl .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 5.4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
.lotl .arm-r{transform-box:view-box;transform-origin:154px 158px}
.lotl.m-wary .gill{animation-duration:4.5s}
.lotl.m-wilt{animation-duration:6s}.lotl.m-wilt .gill{animation:none;transform:rotate(24deg)}.lotl.m-wilt .tail{animation-duration:5s}
.lotl.m-wilt .lid{animation:none;transform:scaleY(.5)}
.spark{opacity:0}.m-proud .spark{opacity:1;animation:tw 1.8s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
/* antics */
.act[data-a=flip]{animation:aFlip 1.4s cubic-bezier(.45,0,.2,1)}
@keyframes aFlip{0%{transform:none}25%{transform:translateY(-26px) rotate(-25deg)}75%{transform:translateY(-18px) rotate(-335deg)}100%{transform:rotate(-360deg)}}
.act[data-a=hop]{animation:aHop .75s cubic-bezier(.3,1.6,.5,1)}
@keyframes aHop{40%{transform:translateY(-30px) scale(1.06,.94)}75%{transform:translateY(4px) scale(.95,1.05)}}
.act[data-a=flinch]{animation:aFlinch 1s ease}
@keyframes aFlinch{12%{transform:translateX(-7px) scale(.94)}26%{transform:translateX(7px) scale(.94)}40%{transform:translateX(-4px) scale(.96)}60%,80%{transform:translateY(12px) scale(.97) rotate(4deg)}}
.act[data-a=peek]{animation:aPeek 2.3s cubic-bezier(.45,0,.2,1)}
@keyframes aPeek{30%,72%{transform:translateY(-5%) scale(1.42,1.3)}42%,60%{transform:translateY(-5%) scale(1.52,1.24)}}
.act[data-a=chase]{animation:aChase 2s ease-in-out}
@keyframes aChase{45%{transform:translate(20%,-24%) rotate(14deg)}58%{transform:translate(22%,-26%) rotate(8deg) scale(1.06)}}
.act[data-a=shimmy]{animation:aShim 1.2s ease-in-out}
@keyframes aShim{15%,45%,75%{transform:rotate(-10deg) scale(1.03)}30%,60%,90%{transform:rotate(10deg) scale(1.03)}}
.act[data-a=nap]{animation:aNap 5.2s ease-in-out}
@keyframes aNap{15%,85%{transform:translateY(24%) rotate(-7deg) scale(.96)}}
.act[data-a=nap] .lid,.act[data-a=sigh] .lid{animation:none;transform:scaleY(1)}
.act[data-a=nap] .gill{animation-duration:6s}
.act[data-a=giggle]{animation:aGig .9s cubic-bezier(.3,1.5,.5,1)}
@keyframes aGig{20%{transform:scale(1.14,.86)}45%{transform:scale(.9,1.12)}70%{transform:scale(1.05,.96)}}
.act[data-a=pebble]{animation:aPeb 2.3s ease-in-out}
@keyframes aPeb{30%{transform:translate(-12%,16%) rotate(-16deg)}48%{transform:translate(-14%,18%) rotate(-22deg)}56%{transform:translate(-9%,13%) rotate(-6deg)}}
.act[data-a=wave] .arm-r{animation:aWave .38s ease-in-out 4 alternate}
@keyframes aWave{to{transform:rotate(-48deg)}}
.act[data-a=wave]{animation:aTilt 1.6s ease-in-out}
@keyframes aTilt{30%,70%{transform:rotate(-6deg)}}
.act[data-a=sigh]{animation:aSigh 2.6s ease-in-out}
@keyframes aSigh{40%,70%{transform:translateY(8%) scale(1.04,.96)}}
.act[data-a=tilt]{animation:aTilt2 1.2s ease-in-out}
@keyframes aTilt2{30%,70%{transform:rotate(12deg) translateX(4%)}}
.fx{position:absolute;z-index:6;left:var(--x);top:var(--y);pointer-events:none}
.fx.b{width:16px;height:16px;margin:-8px;border-radius:50%;border:2px solid rgba(255,255,255,.75);background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.6),transparent 60%);animation:fxUp var(--t,1.6s) ease-out forwards}
@keyframes fxUp{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1;transform:translate(0,-6px) scale(1)}100%{transform:translate(var(--dx,0),-110px) scale(1.1);opacity:0}}
.fx.bh{animation:fxHover 1.2s ease-in-out forwards}
@keyframes fxHover{0%{transform:scale(.3);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:translate(4px,-10px) scale(1)}}
.fx.pop{animation:fxPop .32s ease-out forwards}
@keyframes fxPop{to{transform:scale(2.2);opacity:0}}
.fx.h{width:18px;height:18px;margin:-9px;animation:fxUp 1.5s ease-out forwards}
.fx.h svg{width:100%;height:100%;fill:var(--gill)}
.fx.z{font:italic 600 22px "Instrument Serif",serif;color:rgba(255,255,255,.85);animation:fxZ 2s ease-out forwards}
@keyframes fxZ{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(26px,-70px) scale(1.3)}}
.fx.p{width:16px;height:11px;margin:-6px -8px;border-radius:50% 50% 45% 45%;background:linear-gradient(#ddd3e8,#8c839a);animation:fxRoll 2.4s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes fxRoll{0%{opacity:0;transform:none}10%{opacity:1}35%{transform:none}100%{opacity:1;transform:translateX(var(--dx)) rotate(560deg)}}
.fx.c{width:8px;height:10px;border-radius:2px;background:var(--c);animation:fxBurst 1.7s cubic-bezier(.15,.8,.3,1) forwards}
@keyframes fxBurst{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.fx.r{width:20px;height:20px;margin:-10px;border-radius:50%;border:2px solid rgba(255,255,255,.6);animation:fxRing .9s ease-out forwards}
@keyframes fxRing{0%{transform:scale(.3);opacity:.9}100%{transform:scale(5);opacity:0}}
.cele{position:absolute;left:50%;top:40%;z-index:8;max-width:82%;padding:11px 16px;border-radius:16px;background:rgba(9,8,14,.66);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(123,224,211,.35);font-weight:600;text-align:center;pointer-events:none;animation:cele 4s cubic-bezier(.22,1,.36,1) forwards}
@keyframes cele{0%{opacity:0;transform:translate(-50%,14px) scale(.9)}12%,82%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-10px) scale(.98)}}
@media (prefers-reduced-motion:reduce){.tank *,.lotl,.lotl *{animation:none!important}.lotl.m-wilt .lid{transform:scaleY(.5)}.haze,.meter b{transition:none}}
/* sections */
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.today{margin-top:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;font-weight:600;font-size:15px;background:var(--s2);border:1px solid var(--line);white-space:nowrap}
.pill.aqua{background:var(--aqua);color:#06201d;border-color:transparent}
.pill.ghost{background:transparent}
.pill.full{width:100%}
.pill svg{width:18px;height:18px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:92px;padding:10px 4px 8px;border-radius:18px;background:var(--s1);border:1px solid var(--line);transition:transform .12s,background .2s;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tile:active{transform:scale(.94);background:var(--s2)}
.tile svg{width:30px;height:30px;color:var(--aqua)}
.tile span{font-size:13px;font-weight:600;text-align:center;line-height:1.15}
.tile em{font-style:normal;font-size:12px;color:var(--mute)}
.tile.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.9)}35%{transform:scale(1.1);background:var(--s3)}70%{transform:scale(.97)}100%{transform:none}}
.tile .rip{position:absolute;left:var(--x);top:var(--y);width:16px;height:16px;margin:-8px;border-radius:50%;background:rgba(123,224,211,.45);pointer-events:none;animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(12);opacity:0}}
.tile{overflow:hidden;transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .2s}
.tile:active{transform:scale(.92);transition-duration:.08s}
.qh{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 8px}.qh b{font-size:17px}.qh span{font-size:12px;color:var(--dim)}
.qrow{display:flex;gap:8px;align-items:stretch}
.qs{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);padding-right:24px}
.qs::-webkit-scrollbar{display:none}
.qs .tile{flex:none;width:94px;min-height:78px;padding:9px 6px 7px;scroll-snap-align:start}
.qs .tile svg{width:24px;height:24px}
.qmore{flex:none;width:58px;border-radius:18px;background:var(--s2);border:1px solid var(--line);display:grid;place-content:center;justify-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--mute);transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.qmore:active{transform:scale(.92);transition-duration:.08s}
.qmore svg{width:22px;height:22px;color:var(--aqua)}
.qty{display:grid;grid-template-columns:auto 44px minmax(0,1fr) 44px;gap:6px;align-items:center}
.qty .pill{padding:0 12px;min-height:44px;font-size:18px}.qty .pill.h{font-size:14px}
.qty input{text-align:center}
.hint{font-size:13px;color:var(--dim);margin-top:8px}
.log{list-style:none;margin:0;padding:0}
.log li{border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.log li::before{content:"Delete";position:absolute;inset:1px 0;border-radius:12px;display:flex;align-items:center;justify-content:flex-end;padding-right:18px;background:rgba(255,93,99,.25);color:#fff;font-weight:600;font-size:14px;opacity:0;transition:opacity .15s,background .15s}
.log li.swp::before{opacity:1}.log li.sw::before{background:var(--over)}
.log li>button{position:relative;touch-action:pan-y;transition:transform .35s cubic-bezier(.22,1,.36,1),background .2s;background:var(--bg)}
details .log li>button{background:var(--s1)}
.log .ed{width:16px;height:16px;color:var(--dim)}
.log li>button:active{background:var(--s2)}
.log li>button{display:grid;grid-template-columns:52px minmax(0,1fr) auto 16px;gap:10px;align-items:center;width:100%;min-height:56px;padding:10px 4px;text-align:left;border-radius:12px}
.log li:last-child{border-bottom:0}
.log time{color:var(--mute);font-size:14px;white-space:nowrap}
.log .n{font-weight:600}
.log .d{font-size:13px;color:var(--mute)}
.log .s{font-family:"Instrument Serif",serif;font-size:24px;text-align:right;white-space:nowrap}
.log .s.over{color:var(--over)}
.log .s.thc{color:var(--lav);font-size:20px}.log .s.thc small{font-family:inherit;font-size:12px;margin-left:2px;color:var(--mute)}
.tile.thc svg{color:var(--lav)}
.liverfig{position:relative;margin:4px -6px 0}
.liver{display:block;width:100%;height:auto;overflow:visible}
.liver .lvb{animation:lvBreath 6s ease-in-out infinite}
@keyframes lvBreath{50%{filter:brightness(1.06)}}
@media (prefers-reduced-motion:reduce){.liver .lvb{animation:none}}

function topTriggers(L,n=3){const tg=L.filter(x=>x.tags&&(x.tags.where||x.tags.who||x.tags.mood));if(tg.length<3)return null;const tot=sum(tg,'std')||tg.length;const m=new Map();
 for(const x of tg)for(const g of['mood','who','where']){const v=x.tags[g];if(!v)continue;const k=g+'|'+v,o=m.get(k)||{g,v,std:0,c:0};o.std+=x.std||0;o.c++;m.set(k,o)}
 const arr=[...m.values()].filter(o=>o.c>=2).sort((a,b)=>b.std-a.std||b.c-a.c);const out=[];const used=new Set();for(const o of arr){if(out.length>=n)break;if(used.has(o.g)&&arr.filter(a=>!used.has(a.g)).length&&out.length<2)continue;used.add(o.g);out.push({...o,share:Math.round(o.std/tot*100)})}

 const good=ms.filter(e=>e.feel==='great'||e.feel==='ok'),bad=ms.filter(e=>e.feel==='rough'||e.feel==='awful'),avg=a=>a.reduce((s,e)=>s+night(e.day),0)/a.length;

function weekData(wk){const st=S.settings,we=addDays(wk,7),ds=dayStart(now()),since=dayStart(st.since||now()),L=D().filter(x=>x.t>=wk&&x.t<we);
 const per=Array.from({length:7},(_,i)=>sum(L.filter(x=>x.t>=addDays(wk,i)&&x.t<addDays(wk,i+1)),'std'));
 let dry=0,counted=0;for(let i=0;i<7;i++){const a=addDays(wk,i);if(a<since||a>ds)continue;counted++;if(!per[i])dry++}
 const std=sum(L,'std'),cal=sum(L,'cal'),usual=st.baseline*150*counted/7,overDays=per.filter(v=>v>st.daily+1e-6).length;
 const avg4=end=>{const s=addDays(end,-28);let tot=sum(D().filter(x=>x.t>=s&&x.t<end),'std');const pre=Math.max(0,Math.min(28,Math.round((since-s)/DAY)));tot+=(+st.baseline||0)/7*pre;return tot/4};

function addDrink(d,{skipCheck=false,tile=null}={}){const f=skipCheck?null:friction(d);if(f){pause(f);return}

 const s=stats();play(s.wStd>S.settings.weekly+1e-6?'flinch':'hop',true);toast(`${esc(d.name)} · ${f1(s.wStd)} of ${S.settings.weekly}`,()=>{d.del=true;d.u=now();commit()},{label:'Tag',fn:()=>tagSheet(d)})}
function makeDrink(p,o={}){const n=activeNight(),place=o.place||(n?'bar':'home'),ml=+(o.ml??p.ml),abv=+(o.abv??p.abv),pr=S.settings.prices[p.id];
 const price=o.price!=null?+o.price:(pr&&pr[place]!=null?+pr[place]:p[place]);
 return{id:uid(),t:o.t??now(),pid:p.id,name:(o.name??p.name)||'Drink',ml,abv,std:r2(stdOf(ml,abv)),cal:calFor(p,ml,abv),price:r2(price||0),place,u:now()}}
function calFor(p,ml,abv){return Math.round(p.cal?p.cal*(ml/p.ml)*(.45+.55*abv/p.abv):ml*abv/100*.789*7*1.3)}
function friction(d){const s=stats(),st=S.settings,n=activeNight(),r=[];
 if(st.dryDays.includes(s.dayIdx)&&s.todayDry)r.push({k:'dry'});
 if(n){const nd=nightDrinks(n);if(nd.length>=n.limit)r.push({k:'night',n:nd.length+1,lim:n.limit});const last=nd[nd.length-1];if(last){const ok=last.t+n.pace*MIN;if(now()<ok)r.push({k:'pace',min:Math.ceil((ok-now())/MIN),at:clock(ok),pace:n.pace})}}
 if(s.tStd+d.std>st.daily+.05)r.push({k:'day'});
 if(s.wStd+d.std>st.weekly+.05)r.push({k:'week'});
 return r.length?{r,s,d}:null}
let pending=null;
function pause(f){pending=f.d;const st=S.settings,b=st.tone==='blunt'?'b':'g',top=f.r[0],[h,sub]=COPY[top.k][b].map(x=>fillT(x,top));const s=f.s,d=f.d,nw=s.wStd+d.std,nt=s.tStd+d.std;
 const m=nw>st.weekly+1e-6?'wilt':'wary';
 const note=pickNote();
 openSheet(`${lotl(m,'mini')}<h3 style="text-align:center">${esc(h)}</h3><p class="mute" style="text-align:center">${esc(sub)}</p>${note?`<div class="fnote"><span class="lbl">A note from you</span><p>“${esc(note)}”</p></div>`:''}
 <div class="facts"><div><span>This week</span><b class="${nw>st.weekly?'overc':''}">${f1(s.wStd)} → ${f1(nw)} of ${st.weekly}</b></div><div><span>Today</span><b class="${nt>st.daily?'overc':''}">${f1(s.tStd)} → ${f1(nt)} of ${st.daily}</b></div><div><span>This one adds</span><b>${f1(d.std)} drinks · ${d.cal} cal</b></div>${nw>st.weekly+1e-6?`<div><span>Over your week</span><b class="overc">${f1(nw-st.weekly)} drinks · ${Math.round(s.oCal+d.cal*Math.min(1,(nw-Math.max(s.wStd,st.weekly))/d.std))} extra cal</b></div>`:''}</div>
 <div class="btns"><button class="pill aqua full" data-act="pauseRide">Ride it out · 90 seconds</button><button class="pill full" data-act="pauseSwap">Have water instead</button><div class="hold" role="button" tabindex="0" data-hold="logAnyway"><span class="f"></span><span>Hold to log ${esc(d.name)} anyway</span></div></div>`)}
function editSheet(x,isNew){const p=findP(x.pid||'beer');const sizes=[[44,'1.5 oz'],[150,'5 oz'],[355,'12 oz'],[473,'16 oz'],[568,'20 oz'],[750,'Bottle']];
 const tv=new Date(x.t-new Date(x.t).getTimezoneOffset()*MIN).toISOString().slice(0,16);
 openSheet(`<h3>${isNew?'Log a drink':'Edit drink'}</h3><form id="ef"><div class="field"><label for="en">Name</label><input id="en" type="text" maxlength="40" value="${esc(x.name)}"></div>
 <div class="field"><label for="eml">Size in ml</label><div class="seg" style="margin-bottom:6px">${sizes.map(([v,l])=>`<button type="button" data-act="esize" data-v="${v}">${l}</button>`).join('')}</div><div class="qty"><button type="button" class="pill h" data-act="mlq" data-v="half">Half</button><button type="button" class="pill" data-act="mlq" data-v="-" aria-label="Smaller">−</button><input id="eml" type="number" inputmode="decimal" min="10" max="2000" step="1" value="${Math.round(x.ml)}"><button type="button" class="pill" data-act="mlq" data-v="+" aria-label="Larger">+</button></div></div>
 <div class="field"><label for="eabv">Strength <output id="eabvo">${f1(x.abv)}%</output></label><input id="eabv" type="range" min="0.5" max="60" step="0.5" value="${x.abv}"></div>
 <div class="field"><label for="et">When</label><input id="et" type="datetime-local" value="${tv}"></div>
 <details class="tagd"${tagTxt(x)?' open':''}><summary>Context${tagTxt(x)?': '+esc(tagTxt(x)):' (optional)'}</summary>${tagPicker(x)}</details>
 ${isNew?`<label class="setrow" style="cursor:pointer"><span class="t">Add to my drinks<small>Shows up as a one-tap button</small></span><input id="esave" type="checkbox" style="width:24px;height:24px;accent-color:var(--aqua)"></label>`:''}
 <div class="facts"><div><span>Standard drinks</span><b id="estd" class="num" style="font-size:24px">${f1(stdOf(x.ml,x.abv))}</b></div></div>
 <div class="btns"><button class="pill aqua full" type="submit">${isNew?'Log it':'Save'}</button>${isNew?'':`<button class="pill ghost full" type="button" data-act="delDrink" style="color:var(--over)">Delete</button>`}</div></form>`,()=>{
  tagTarget=x;const ml=$('#eml'),abv=$('#eabv'),upd=()=>{$('#eabvo').textContent=f1(+abv.value)+'%';$('#estd').textContent=f1(stdOf(+ml.value||0,+abv.value||0))};ml.oninput=upd;abv.oninput=upd;
  $('#sheet').dataset.edit=isNew?'':x.id;
  $('#ef').onsubmit=e=>{e.preventDefault();const o={name:$('#en').value.trim()||p.name,ml:Math.max(1,+ml.value||p.ml),abv:+abv.value,t:new Date($('#et').value).getTime()||now()};
   if(isNew){const d=makeDrink(p,{...o,place:x.place});if(x.tags)d.tags={...x.tags};if($('#esave')&&$('#esave').checked){S.custom.push({id:'c'+uid(),name:o.name,ml:o.ml,abv:o.abv,cal:0,home:0,bar:0,g:'star',u:now()})}closeSheet();addDrink(d)}
   else{Object.assign(x,o,{std:r2(stdOf(o.ml,o.abv)),cal:calFor(p,o.ml,o.abv),u:now()});seenHint();closeSheet();commit();toast('Saved')}}})}
function planNight(){const s=stats(),st=S.settings,def=Math.max(1,Math.min(st.daily,Math.floor(Math.max(1,s.left))));const nw={limit:def,pace:45,water:true};
 const draw=()=>openSheet(`${lotl('glow','mini')}<h3 style="text-align:center">Plan tonight before it starts</h3><p class="mute" style="text-align:center">Deciding now, with a clear head, is the single best predictor of sticking to it.</p>
 <div class="setrow"><div class="t">Drinks tonight<small>${f1(Math.max(0,s.left))} left in your week</small></div><div class="step"><button data-act="nstep" data-d="-1" aria-label="Less">−</button><output>${nw.limit}</output><button data-act="nstep" data-d="1" aria-label="More">+</button></div></div>
 <div class="field"><span class="lbl">Minutes between rounds</span><div class="seg">${[30,45,60,90].map(v=>`<button data-act="npace" data-v="${v}" aria-pressed="${nw.pace===v}">${v}</button>`).join('')}</div></div>
 <div class="field"><span class="lbl">Water between rounds</span><div class="seg"><button data-act="nwater" data-v="1" aria-pressed="${nw.water}">Yes</button><button data-act="nwater" data-v="0" aria-pressed="${!nw.water}">No</button></div></div>
 <div class="btns"><button class="pill aqua full" data-act="nstart">Start the night</button></div>`);
 nightDraft={nw,draw};draw()}
let nightDraft=null;

/* ---------- sheet & toast ---------- */
let openedAt=0;
function openSheet(html,mount){openedAt=now();{const t=$('#toast');if(t&&t.classList.contains('on')){t.classList.remove('on');t._undo=null;t._x2=null}}const sh=$('#sheet'),sc=$('#scrim');sh.innerHTML=`<div class="grab"></div><button class="x" data-act="close" aria-label="Close">×</button>${html}`;sh.hidden=false;sc.hidden=false;requestAnimationFrame(()=>{sh.classList.add('on');sc.classList.add('on')});if(mount)mount();const f=sh.querySelector('button.pill,input');if(f&&matchMedia('(hover:hover)').matches)f.focus({preventScroll:true})}
function closeSheet(){const sh=$('#sheet'),sc=$('#scrim');sh.classList.remove('on');sc.classList.remove('on');setTimeout(()=>{if(!sh.classList.contains('on')){sh.hidden=true;sc.hidden=true;sh.innerHTML=''}},300);pending=null;nightDraft=null;mDraft=null;rvDraft=null;tagTarget=null;if(pendingRender)setTimeout(render,320)}
let tT=0;function toast(msg,undo,x2){const t=$('#toast');t.innerHTML=`<span>${msg}</span>${x2?`<button class="x2" data-act="toastx">${x2.label}</button>`:''}${undo?'<button data-act="undo">Undo</button>':''}`;t._undo=undo;t._x2=x2&&x2.fn;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>{t.classList.remove('on');t._undo=null},undo?5000:2200)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act],[data-add],[data-edit],[data-go],.tabs a');if(!el)return;
 if(el.matches('.tabs a')){e.preventDefault();go(el.dataset.v);return}
 if(el.dataset.go){go(el.dataset.go);return}
 if(el.dataset.add&&el.closest('#sheet')&&!longFired)closeSheet();
 if(el.dataset.add)ripple(el,e);
 if(el.dataset.add==='thc'){if(longFired){longFired=false;return}logThc(makeThc({}));return}
 if(el.dataset.add){if(longFired){longFired=false;return}addDrink(makeDrink(findP(el.dataset.add)),{tile:el.dataset.add});return}
 if(el.dataset.edit&&now()-swipedAt<450)return;
 if(el.dataset.edit){const x=S.drinks.find(d=>d.id===el.dataset.edit);if(x)(x.kind==='thc'?thcSheet(x,false):editSheet(x,false));return}
 const a=el.dataset.act,st=S.settings;
 if(a==='close'){closeSheet();return}
 if(a==='undo'){const t=$('#toast');if(t._undo){t._undo();t._undo=null}t.classList.remove('on');return}
 if(a==='custom'){editSheet({pid:'beer',name:'',ml:355,abv:5,price:activeNight()?9:2,t:now(),place:activeNight()?'bar':'home'},true);return}
 if(a==='esize'){$('#eml').value=el.dataset.v;$('#eml').oninput();return}
 if(a==='mlq'){const i=$('#eml');if(!i)return;let v=+i.value||0;v=el.dataset.v==='half'?v/2:el.dataset.v==='+'?v*1.25:v*.8;i.value=Math.max(10,Math.min(2000,Math.round(v)));i.oninput&&i.oninput();return}
 if(a==='allDrinks'){allDrinks();return}
 if(a==='toastx'){const t=$('#toast'),f=t._x2;t._x2=null;t.classList.remove('on');if(f)f();return}
 if(a==='tag'){setTag(el.dataset.g,el.dataset.v);const sm=el.closest('details')&&el.closest('details').querySelector('summary');if(sm&&tagTarget)sm.textContent='Context'+(tagTxt(tagTarget)?': '+tagTxt(tagTarget):' (optional)');return}
 if(a==='morning'){const m=morningDue();if(m)morningSheet(m);return}
 if(a==='mfeel'&&mDraft){mDraft.feel=el.dataset.v;for(const b of el.parentNode.children)b.setAttribute('aria-pressed',b===el);const sv=$('#sheet [data-act="msave"]');if(sv)sv.disabled=false;return}
 if(a==='msleep'&&mDraft){mDraft.sleep=mDraft.sleep===el.dataset.v?null:el.dataset.v;for(const b of el.parentNode.children)b.setAttribute('aria-pressed',b.dataset.v===mDraft.sleep);return}
 if(a==='msave'&&mDraft&&mDraft.feel){const m=mDraft;mDraft=null;S.events.push({id:uid(),t:now(),type:'morning',day:m.day,feel:m.feel,sleep:m.sleep,u:now()});closeSheet();commit();toast(m.feel==='great'||m.feel==='ok'?'Noted. Good mornings count too.':'Noted. Lotl will remember how last night landed.');play(m.feel==='great'?'hop':m.feel==='ok'?'wave':'sigh',true);return}
 if(a==='mskip'&&mDraft){const m=mDraft;mDraft=null;S.events.push({id:uid(),t:now(),type:'morning',day:m.day,skip:true,u:now()});closeSheet();commit();return}
 if(a==='review'){const w=reviewDue();if(w!=null)reviewSheet(w);return}
 if(a==='reviewAny'){const w=reviewWeek();reviewSheet(w!=null?w:addDays(weekStart(now()),-7));return}
 if(a==='rvGoal'&&rvDraft){rvDraft.sel=+el.dataset.i;for(const b of el.parentNode.querySelectorAll('button'))b.setAttribute('aria-pressed',b===el);const o=$('#rvOwn');if(o)o.value='';return}
 if(a==='rvSave'&&rvDraft){const own=($('#rvOwn')||{}).value;const g=own&&own.trim()?{k:'own',text:own.trim().slice(0,60)}:rvDraft.sel!=null?rvDraft.opts[rvDraft.sel]:null;if(!g){toast('Pick a goal or write one.');return}saveReview(g);return}
 if(a==='rvSkip'&&rvDraft){saveReview(null);return}
 if(a==='addNote'){const ta=$('#noteNew'),v=ta&&ta.value.trim().slice(0,160);if(!v){toast('Write the note first.');return}ta.value='';ta.blur();st.notes=[...(st.notes||[]),v].slice(0,6);st.u=now();commit();toast('Saved. Future you will see it.');return}
 if(a==='rmNote'){st.notes=(st.notes||[]).filter((_,i)=>i!==+el.dataset.i);st.u=now();commit();return}
 if(a==='lotlTap'){lotlTap();return}
 if(a==='delDrink'){const x=S.drinks.find(d=>d.id===$('#sheet').dataset.edit);if(x){closeSheet();delWithUndo(x)}return}
 if(a==='pauseRide'){const d=pending;closeSheet();calm.from=d;go('calm');setTimeout(()=>startCalm(),350);return}
 if(a==='pauseSwap'){S.events.push({id:uid(),t:now(),type:'swap',u:now()});closeSheet();commit();toast('Water it is. Lotl noticed.');return}
 if(a==='planNight'){planNight();return}
 if(a==='nstep'&&nightDraft){nightDraft.nw.limit=Math.max(1,Math.min(15,nightDraft.nw.limit+ +el.dataset.d));el.parentNode.querySelector('output').textContent=nightDraft.nw.limit;return}
 if(a==='npace'&&nightDraft){nightDraft.nw.pace=+el.dataset.v;for(const b of el.parentNode.children)b.setAttribute('aria-pressed',b===el);return}
 if(a==='nwater'&&nightDraft){nightDraft.nw.water=el.dataset.v==='1';for(const b of el.parentNode.children)b.setAttribute('aria-pressed',b===el);return}
 if(a==='nstart'&&nightDraft){S.nights.push({id:uid(),start:now(),t:now(),...nightDraft.nw,u:now()});closeSheet();commit();toast('Night plan set. Have fun.');return}
 if(a==='endNight'){const n=activeNight();if(n){n.end=now();n.u=now();commit();const c=nightDrinks(n).length;toast(c<=n.limit?`Night done: ${c} of ${n.limit}. Plan kept.`:`Night done: ${c} of ${n.limit}.`)}return}
 if(a==='calmStart'){startCalm();return}
 if(a==='calmStop'){calm.on=false;calm.done=false;clearInterval(calm.timer);render();return}
 if(a==='calmPassed'){S.events.push({id:uid(),t:now(),type:'urge',u:now()});calm.done=false;calm.from=null;commit();toast('Craving ridden out. Lotl glows a little brighter.');return}
 if(a==='calmStill'){const d=calm.from;calm.done=false;calm.from=null;go('today');if(d){setTimeout(()=>{d.t=now();d.u=now();addDrink(d,{skipCheck:true})},50)}return}
 if(a==='step'){const k=el.dataset.k,[lo,hi]=LIM[k],tgt=el.dataset.ob?OB:st;tgt[k]=Math.max(lo,Math.min(hi,(+tgt[k]||0)+ +el.dataset.d));if(el.dataset.ob){if(k==='baseline'&&OB.step===1){OB.weekly=Math.max(1,Math.round(OB.baseline*.67));OB.daily=Math.max(1,Math.min(OB.daily,OB.weekly))}el.parentNode.querySelector('output').textContent=tgt[k];if(OB.step===2&&k==='weekly'){}return}st.u=now();commit();return}
 if(a==='dryDay'){const i=+el.dataset.i;st.dryDays=st.dryDays.includes(i)?st.dryDays.filter(x=>x!==i):[...st.dryDays,i].sort();st.u=now();commit();return}
 if(a==='tone'){st.tone=el.dataset.v;st.u=now();commit();return}
 if(a==='lines'){st.lines=el.dataset.v;st.u=now();commit();return}
 if(a==='tmg'){const i=$('#tmg');if(i)i.value=el.dataset.v;return}
 if(a==='rmCustom'){const c=S.custom.find(c=>c.id===el.dataset.id);if(c){c.del=true;c.u=now();commit()}return}
 if(a==='export'){exportSheet();return}
 if(a==='copyData'){const ta=$('#dataTa');ta.select();(navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.reject()).then(()=>toast('Copied. Paste it somewhere safe.'),()=>{try{document.execCommand('copy');toast('Copied.')}catch(_){toast('Select the text and copy it.')}});return}
 if(a==='importData'){try{const j=JSON.parse($('#impTa').value);if(!j||!Array.isArray(j.drinks))throw 0;S=normalize(merge(S,normalize(j)));closeSheet();commit();toast(`Imported. ${D().length} drinks in total.`)}catch(_){toast('That doesn\'t look like an Ebb backup.')}return}
 if(a==='obNext'){if(OB.step===3)return;OB.step++;onboard();return}
 if(a==='obTone'){OB.why=($('#obwhy')||{}).value||OB.why;OB.tone=el.dataset.v;onboard();return}
 if(a==='obWhy'){const ta=$('#obwhy');ta.value=ta.value?ta.value.replace(/\s*$/,'')+', '+el.dataset.v.toLowerCase():el.dataset.v;return}
 if(a==='obDone'){OB.why=$('#obwhy').value.trim();Object.assign(S.settings,{baseline:OB.baseline,price:OB.price,weekly:OB.weekly,daily:OB.daily,dryTarget:OB.dryTarget,tone:OB.tone,why:OB.why,since:S.settings.since||now(),u:now()});S.setup=true;commit();return}
});
document.addEventListener('change',e=>{const el=e.target,st=S.settings;
 if(el.dataset.set){st[el.dataset.set]=el.value.trim().slice(0,el.dataset.set==='cur'?3:160)||(el.dataset.set==='cur'?'$':'');st.u=now();el.blur();commit()}
 if(el.dataset.price){const o=st.prices[el.dataset.price]={...(st.prices[el.dataset.price]||{})};o[el.dataset.pl]=Math.max(0,+el.value||0);st.u=now();saveLocal();queueSync()}});
document.addEventListener('focusout',()=>{if(pendingRender)setTimeout(()=>{const ae=document.activeElement;if(!(ae&&/INPUT|TEXTAREA/.test(ae.tagName)))render()},50)});
function exportSheet(){openSheet(`<h3>Back up or move your data</h3><p class="mute">Copy this text and keep it in Notes or email it to yourself. Paste it below on another device to bring everything across.</p><textarea id="dataTa" readonly style="min-height:120px;font-size:12px">${esc(JSON.stringify(S))}</textarea><div class="btns"><button class="pill aqua full" data-act="copyData">Copy backup</button></div><div class="field"><label for="impTa">Restore from a backup</label><textarea id="impTa" placeholder="Paste a backup here"></textarea></div><div class="btns"><button class="pill full" data-act="importData">Import and merge</button></div>`)}
function startCalm(){calm.on=true;calm.done=false;calm.start=now();clearInterval(calm.timer);if(view!=='calm'){go('calm')}else render();calm.timer=setInterval(calmTick,250);calmTick()}

/* hold-to-confirm and long-press */
let holdT=0,longT=0,longFired=false,downEl=null;
function holdStart(el){el.classList.add('on');holdT=setTimeout(()=>{el.classList.remove('on');runHold(el.dataset.hold)},1400)}
function holdEnd(){clearTimeout(holdT);for(const h of document.querySelectorAll('.hold.on'))h.classList.remove('on')}
function runHold(k){if(k==='logAnyway'&&pending){const d=pending;closeSheet();d.t=now();d.u=now();addDrink(d,{skipCheck:true})}
 if(k==='clearLog'){const t=now();for(const k2 of['drinks','events','nights'])for(const x of S[k2]){x.del=true;x.u=t}S.settings.since=t;S.settings.u=t;try{localStorage.removeItem('ebb.cele')}catch(e){}commit();toast('Drink log cleared. Your plan is unchanged.');return}
 if(k==='reset'){const t=now();for(const k2 of['drinks','events','nights','custom'])for(const x of S[k2]){x.del=true;x.u=t}S.settings={...DEF().settings,u:t};S.setup=false;OB={step:0,baseline:14,weekly:10,daily:4,dryTarget:2,tone:'gentle',why:'',price:10};saveLocal();queueSync();location.hash='';view='today';render()}}
let dx=0,dy=0;
document.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-hold]');if(h){e.preventDefault();holdStart(h);return}
 const t=e.target.closest('[data-add]');if(t){downEl=t;dx=e.clientX;dy=e.clientY;longFired=false;clearTimeout(longT);longT=setTimeout(()=>{longFired=true;if(t.dataset.add==='thc'){thcSheet(makeThc({}),true);return}const p=findP(t.dataset.add),n=activeNight();editSheet({pid:p.id,name:p.name,ml:p.ml,abv:p.abv,price:makeDrink(p).price,t:now(),place:n?'bar':'home'},true)},480)}});
for(const ev of['pointerup','pointercancel'])document.addEventListener(ev,()=>{holdEnd();clearTimeout(longT);downEl=null},true);
document.addEventListener('pointerout',e=>{if(e.target.closest&&e.target.closest('[data-hold]')&&!(e.relatedTarget&&e.target.closest('[data-hold]').contains(e.relatedTarget)))holdEnd()});
document.addEventListener('pointermove',e=>{if(downEl&&Math.hypot(e.clientX-dx,e.clientY-dy)>8)clearTimeout(longT)});
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-add]'))e.preventDefault()});
document.addEventListener('keydown',e=>{const h=e.target.closest&&e.target.closest('[data-hold]');if(h&&(e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();holdStart(h)}if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
document.addEventListener('keyup',e=>{if(e.target.closest&&e.target.closest('[data-hold]'))holdEnd()});
$('#scrim').addEventListener('click',()=>{if(now()-openedAt>450)closeSheet()});

/* live updates */
setInterval(()=>{const n=activeNight(),pt=$('#paceTxt');if(n&&pt&&view==='today'){pt.innerHTML=paceText(n);const nd=nightDrinks(n),last=nd[nd.length-1],r=$('#paceRing');if(r&&last){const w=last.t+n.pace*MIN-now(),C=2*Math.PI*20;r.style.strokeDashoffset=C*(w>0?w/(n.pace*MIN):0);r.setAttribute('stroke',w>0?'var(--warm)':'var(--aqua)')}}},1000);
let lastDay=dayStart(now());setInterval(()=>{const d=dayStart(now());if(d!==lastDay&&$('#sheet').hidden){lastDay=d;render()}},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('#sheet').hidden&&!calm.on)render()});
window.addEventListener('hashchange',route);

/* start */
let started=false;
function ready(){if(started)return;started=true;route()}
if(!(window.claude&&window.claude.use)||hadLocal)ready();
initRemote();
if(!(window.claude&&window.claude.use)&&navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}
if('serviceWorker' in navigator&&window.top===window&&location.protocol==='https:'&&!/claude/.test(location.hostname)){let rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!rl&&navigator.serviceWorker.controller){rl=true;location.reload()}});navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{})}
}
